<html>
  <head>
    <title>Cy.js PDF demo</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        font-family: Arial, sans-serif;
      }

      #toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: #111827;
        color: white;
      }

      #toolbar h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }

      #export {
        border: none;
        background: #3b82f6;
        color: white;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }

      #export:hover {
        background: #2563eb;
      }

      #cy {
        width: 100%;
        height: calc(100% - 58px);
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.umd.js"></script>
    <script src="../../dist/cytoscape-pdf-export.js"></script>
  </head>

  <body>
    <div id="toolbar">
      <h1>More styles</h1>
      <button id="export">Export PDF</button>
    </div>
    <div id="cy"></div>
    <script src="code.js"></script>
  </body>
</html>
