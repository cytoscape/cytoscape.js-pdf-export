<!DOCTYPE>
<!-- This code is for demonstration purposes only.  You should not hotlink to Github, Rawgit, or files from the Cytoscape.js documentation in your production apps. -->
<html>
  <head>
    <title>Edge arrow types demo</title>
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1">
    <link href="style.css" rel="stylesheet" />

    <style>
      html, body {
        margin: 0;
        height: 100%;
        font-family: Arial, sans-serif;
      }

      #toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: #111827;
        color: white;
      }

      #toolbar h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }

      #export {
        border: none;
        background: #3b82f6;
        color: white;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }

      #export:hover {
        background: #2563eb;
      }

      #cy {
        top: 58px !important;
        height: calc(100% - 58px) !important;
      }
    </style>

    <!-- For loading external data files -->
    <script src="https://cdn.polyfill.io/v2/polyfill.min.js?features=Promise,fetch"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.umd.js"></script>
    <script src="../../dist/cytoscape-pdf-export.js"></script>

    <!-- for testing with local version of cytoscape.js -->
    <!--<script src="../cytoscape.js/build/cytoscape.js"></script>-->
  </head>
  <body>
    <div id="toolbar">
      <h1>Edge arrow types demo</h1>
      <button id="export">Export PDF</button>
    </div>
    <div id="cy"></div>
    <button id="hollow">Toggle hollow</button>
    <!-- Load application code at the end to ensure DOM is loaded -->
    <script src="code.js"></script>
  </body>
</html>
